<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="logoSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Modern squircle badge background -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#logoGrad)" />
  <rect x="2" y="2" width="60" height="30" rx="14" fill="url(#logoSheen)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Medical Cross Geometry -->
  <g fill="#ffffff">
    <rect x="26.5" y="13" width="11" height="38" rx="5.5" />
    <rect x="13" y="26.5" width="38" height="11" rx="5.5" />
  </g>

  <!-- Center Radiology Energy Ring -->
  <circle cx="32" cy="32" r="5" fill="#1d4ed8" />
  <circle cx="32" cy="32" r="2.5" fill="#38bdf8" />

  <!-- Pulse / Sensor lines -->
  <path d="M19 32h5l2.5-4 4 8 3-5 2.5 1h6" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
